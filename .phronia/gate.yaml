version: 1
protectedPaths:
  - ".phronia/**"
  - "docs/architecture.md"
  - "docs/requirements.md"
postEditChecks:
  - "phronia rules gate --changed"
  - "phronia rules check --changed"
requireVerdictCoverage: 1
denyOn:
  - "severity>=critical && status=fail"
  - "missing_verdict && severity>=high"
phaseGates:
  before_commit:
    - "phronia rules verdict --task {task} --check"
